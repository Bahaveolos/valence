<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bohr Sort">
<title>Bohr diagram sort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#E6ECF1; --surface:#D3DCE4; --ink:#1F2A44; --muted:#56637A;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --good:#2E7D4F; --bad:#B8322A;
  --zone-hover:rgba(31,78,140,.18);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16202E; --surface:#223044; --ink:#E7EDF5; --muted:#A3B1C4;
    --accent:#7FB0F0; --accent-ink:#0F1A2A; --good:#5CC88A; --bad:#FF7B70;
    --zone-hover:rgba(127,176,240,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16202E; --surface:#223044; --ink:#E7EDF5; --muted:#A3B1C4;
  --accent:#7FB0F0; --accent-ink:#0F1A2A; --good:#5CC88A; --bad:#FF7B70;
  --zone-hover:rgba(127,176,240,.3); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",-apple-system,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
.status{color:var(--muted);font-size:1rem;margin-right:auto}
.status b{color:var(--ink)}
button{
  font:inherit;font-size:.95rem;border:2px solid var(--accent);background:var(--accent);
  color:var(--accent-ink);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:44px;
}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{flex:1;min-height:0;display:flex;gap:12px;padding:0 12px 12px}
#boardWrap{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;background:#fff;border-radius:10px;padding:0}
#gridImg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.zone{position:absolute}
.zone.hover{background:var(--zone-hover);outline:3px solid var(--accent)}
.zone.wrong{animation:wrong .45s}
.zone.pop .tile{animation:pop .35s}
@keyframes wrong{0%,100%{background:transparent}30%{background:rgba(184,50,42,.3);outline:3px solid var(--bad)}}
@keyframes pop{0%{transform:scale(1.12)}100%{transform:scale(1)}}
#trayWrap{width:34%;min-width:0;min-height:0;background:var(--surface);border-radius:12px;padding:10px;display:flex}
#tray{flex:1;display:grid;gap:8px;align-content:start;justify-content:center}
@media (orientation: portrait){ main{flex-direction:column} #trayWrap{width:auto;height:38%} .quizzing #trayWrap{height:50%} }
.tile{
  width:var(--tile);height:var(--tile);touch-action:none;cursor:grab;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.tile img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.slot{width:var(--tile);height:var(--tile)}
.tile.dragging{position:fixed;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.35);cursor:grabbing}
.tile.returning{transition:left .22s ease,top .22s ease,width .22s ease,height .22s ease}
.zone .tile{width:100%;height:100%;box-shadow:none;cursor:default}
/* Pattern questions */
#quiz{flex:1;display:none;flex-direction:column;gap:12px;overflow-y:auto;padding:6px 6px 10px;-webkit-overflow-scrolling:touch}
.quizzing #tray{display:none}
.quizzing #quiz{display:flex;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q-progress{display:flex;gap:6px}
.q-progress span{flex:1;height:6px;border-radius:3px;background:var(--bg)}
.q-progress span.done{background:var(--good)}
.q-progress span.now{background:var(--accent)}
.q-count{color:var(--muted);font-size:.95rem;margin:0}
.q-prompt{font-size:1.15rem;line-height:1.45;margin:0;font-weight:700}
.q-opts{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;background:var(--bg);color:var(--ink);border:2px solid transparent;
  border-radius:10px;padding:10px 14px;font-size:1rem;line-height:1.35;min-height:48px;
}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt.correct{border-color:var(--good);background:var(--good);color:#fff}
.opt:disabled{cursor:default}
.q-feedback{margin:0;line-height:1.45;font-size:1rem}
.q-feedback.hint{color:var(--bad)}
.q-feedback.right{color:var(--ink);border-left:4px solid var(--good);padding-left:10px}
.q-next{align-self:flex-start}
.focusing .zone .tile{opacity:.25;transition:opacity .3s}
.focusing .zone.focus .tile{opacity:1}
.zone.focus{outline:4px solid var(--accent);outline-offset:1px;z-index:2}
@media (prefers-reduced-motion: reduce){ .zone.wrong,.zone.pop .tile,.quizzing #quiz{animation:none} .tile.returning{transition:none} }
</style>
</head>
<body>
<header>
  <h1>Bohr diagram sort</h1>
  <div class="status"><span id="playStatus"><b id="placedCount">0</b> of 20 placed, <span id="mistakeCount">0 misses</span></span><span id="quizStatus" hidden>Pattern questions</span></div>
  <button id="newBtn">New round</button>
</header>
<main>
  <div id="boardWrap">
    <div id="stage">
      <img id="gridImg" alt="Periodic table grid for elements 1 to 20">
      <div id="zones"></div>
    </div>
  </div>
  <div id="trayWrap"><div id="tray"></div><div id="quiz" aria-live="polite"></div></div>
</main>

// Column used by each group
const GROUP_COL = {1:0, 2:1, 13:2, 14:3, 15:4, 16:5, 17:6, 18:7};
// [Z, group, period]
const EL = [[1,1,1],[2,18,1],[3,1,2],[4,2,2],[5,13,2],[6,14,2],[7,15,2],[8,16,2],[9,17,2],[10,18,2],
  [11,1,3],[12,2,3],[13,13,3],[14,14,3],[15,15,3],[16,16,3],[17,17,3],[18,18,3],[19,1,4],[20,2,4]];

const $ = id => document.getElementById(id);
const stage=$("stage"), zonesEl=$("zones"), tray=$("tray");
$("gridImg").src = GRID_SRC;
let placed=new Set(), mistakes=0, drag=null;

function addZone(z,col,row){
  const d=document.createElement("div"); d.className="zone"; if(z) d.dataset.z=z;
  d.style.left=COL_X[col]/GRID_W*100+"%"; d.style.top=ROW_Y[row]/GRID_H*100+"%";
  d.style.width=BOX/GRID_W*100+"%"; d.style.height=BOX/GRID_H*100+"%";
  zonesEl.appendChild(d);
}
EL.forEach(([z,g,p])=>addZone(z,GROUP_COL[g],p-1));

function fitStage(){
  const r=$("boardWrap").getBoundingClientRect(), a=GRID_W/GRID_H;
  let w=r.width, h=w/a; if(h>r.height){ h=r.height; w=h*a; }
  stage.style.width=w+"px"; stage.style.height=h+"px";
}
function fitTray(){
  const r=$("trayWrap").getBoundingClientRect(), W=r.width-20, H=r.height-20, n=20, gap=8;
  let best=0, bestCols=1;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols), s=Math.min((W-gap*(cols-1))/cols,(H-gap*(rows-1))/rows);
    if(s>best){ best=s; bestCols=cols; }
  }
  best=Math.max(36,Math.floor(Math.min(best,140)));
  tray.style.setProperty("--tile",best+"px");
  tray.style.gridTemplateColumns=`repeat(${bestCols}, ${best}px)`;
}
function fitAll(){ fitStage(); fitTray(); }

function makeTile(z){
  const t=document.createElement("div"); t.className="tile"; t.dataset.z=z;
  t.setAttribute("aria-label","Bohr diagram tile");
  const img=document.createElement("img"); img.src=TILES[z]; img.alt=""; img.draggable=false;
  t.appendChild(img); t.addEventListener("pointerdown",onDown); return t;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newRound(){
  placed.clear(); mistakes=0; endQuiz();
  zonesEl.querySelectorAll(".tile").forEach(t=>t.remove());
  zonesEl.querySelectorAll(".zone").forEach(z=>z.classList.remove("pop"));
  tray.innerHTML="";
  shuffle(EL.map(e=>e[0])).forEach(z=>tray.appendChild(makeTile(z)));
  updateStatus();
}
function updateStatus(){
  $("placedCount").textContent=placed.size; $("mistakeCount").textContent=mistakes+(mistakes===1?" miss":" misses");
  if(placed.size===20) setTimeout(startQuiz,500);
}

/* ---------- Pattern questions ---------- */
const NAMES={1:"hydrogen",2:"helium",3:"lithium",4:"beryllium",5:"boron",6:"carbon",7:"nitrogen",8:"oxygen",9:"fluorine",10:"neon",
  11:"sodium",12:"magnesium",13:"aluminum",14:"silicon",15:"phosphorus",16:"sulfur",17:"chlorine",18:"argon",19:"potassium",20:"calcium"};
const cap=w=>w[0].toUpperCase()+w.slice(1);
const nm=z=>cap(NAMES[z]);
function shellsOf(z){ const s=[]; let left=z; for(const c of [2,8,8,2]){ if(left<=0)break; s.push(Math.min(c,left)); left-=c; } return s; }
const valence=z=>shellsOf(z).at(-1), levels=z=>shellsOf(z).length;
const inGroup=g=>EL.filter(e=>e[1]===g).map(e=>e[0]);
const inPeriod=p=>EL.filter(e=>e[2]===p).map(e=>e[0]);
const listOf=zs=>zs.length<3?zs.map(nm).join(" and "):zs.slice(0,-1).map(nm).join(", ")+" and "+nm(zs.at(-1));
const pl=(n,w)=>n+" "+w+(n===1?"":"s");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const GROUPS=[1,2,13,14,15,16,17,18];

const QUESTION_TYPES={
  groupValence(used){
    const g=pick(GROUPS.filter(x=>!used.has("gv"+x))); used.add("gv"+g);
    const zs=inGroup(g).filter(z=>z!==2), n=valence(zs[0]);
    const other=pick([1,2,3,4,5,6,7,8].filter(x=>x!==n));
    return {focus:zs,
      prompt:`Compare ${listOf(zs)}. What do you notice about their valence electrons (the red dots in the outermost energy level)?`,
      correct:`${zs.length===2?"Both":"They all"} have ${pl(n,"valence electron")}.`,
      wrong:[`${zs.length===2?"Both":"They all"} have ${pl(other,"valence electron")}.`,"Each one has one more valence electron than the element above it.","The number of valence electrons doubles from top to bottom."],
      hint:"Count the red dots on each highlighted tile and compare the totals.",
      explain:`Every highlighted element in group ${g} has ${pl(n,"valence electron")}. Elements in the same group share the same number of valence electrons.`+(g===18?" (Helium, at the top of group 18, is the exception: its only energy level is full with 2.)":"")};
  },
  periodValence(used){
    const p=pick([2,3].filter(x=>!used.has("pv"+x))); used.add("pv"+p);
    const zs=inPeriod(p);
    return {focus:zs,
      prompt:`Look across period ${p} from left to right, from ${nm(zs[0])} to ${nm(zs.at(-1))}. What happens to the number of valence electrons?`,
      correct:"It increases by 1 with each element, from 1 up to 8.",
      wrong:["It decreases by 1 with each element.","It stays the same across the whole period.","It increases by 2 with each element."],
      hint:"Count the red dots on each tile in the row, one element at a time from left to right.",
      explain:`${nm(zs[0])} has 1 valence electron and ${NAMES[zs.at(-1)]} has 8. Each step to the right across period ${p} adds exactly one valence electron.`};
  },
  groupLevels(used){
    const g=pick([1,2,18].filter(x=>!used.has("gl"+x))); used.add("gl"+g);
    const zs=inGroup(g);
    const counts=zs.map((z,i)=>(i===0?nm(z):NAMES[z])+" has "+pl(levels(z),"energy level")).join(", ");
    return {focus:zs,
      prompt:`Look down group ${g} from top to bottom: ${listOf(zs)}. What happens to the number of energy levels (rings) that hold electrons?`,
      correct:"It increases by 1 with each step down the group.",
      wrong:["It stays the same for every element in the group.","It decreases by 1 with each step down the group.","It increases by 2 with each step down the group."],
      hint:"Count the rings around the nucleus on each highlighted tile, starting at the top.",
      explain:`${counts}. Each step down a group adds one more energy level.`};
  },
  periodLevels(used){
    const p=pick([1,2,3,4].filter(x=>!used.has("pl"+x))); used.add("pl"+p);
    const zs=inPeriod(p);
    const others=[1,2,3,4].filter(x=>x!==p);
    const desc=zs.length>2?`the elements in period ${p}, from ${nm(zs[0])} to ${nm(zs.at(-1))}`:`${listOf(zs)}, the elements in period ${p}`;
    return {focus:zs,
      prompt:`Compare ${desc}. What do you notice about the number of energy levels their electrons occupy?`,
      correct:`${zs.length===2?"Both":"They all"} have ${pl(p,"energy level")}.`,
      wrong:["The number of energy levels increases by 1 from left to right.",`${zs.length===2?"Both":"They all"} have ${pl(others[0],"energy level")}.`,`${zs.length===2?"Both":"They all"} have ${pl(others.at(-1),"energy level")}.`],
      hint:"Count the rings on each highlighted tile. Do the counts change from left to right?",
      explain:`Every element in period ${p} has ${pl(p,"energy level")}. The period number tells you how many energy levels hold electrons.`};
  },
  whichGroup(used){
    const n=pick([1,2,3,4,5,6,7,8]); const g=n<=2?n:n+10;
    return {focus:[],
      prompt:`Which group’s elements all have ${pl(n,"valence electron")}?`,
      correct:`Group ${g}`,
      wrong:GROUPS.filter(x=>x!==g).sort(()=>Math.random()-.5).slice(0,3).map(x=>"Group "+x),
      hint:`Find a tile with ${n} red ${n===1?"dot":"dots"} in its outer level, then check which column it sits in.`,
      explain:`Group ${g} elements have ${pl(n,"valence electron")}. `+(g<=2?`For groups 1 and 2, the group number equals the number of valence electrons.`:`For groups 13 to 18, the last digit of the group number equals the number of valence electrons`+(g===18?` (except helium, which has 2).`:`.`))};
  },
  predict(used){
    const opts=[["rubidium",1,5,[19]],["strontium",2,5,[20]],["gallium",13,4,[5,13]],["germanium",14,4,[6,14]],
      ["arsenic",15,4,[7,15]],["selenium",16,4,[8,16]],["bromine",17,4,[9,17]],["krypton",18,4,[10,18]]];
    const [name,g,p,above]=pick(opts); const v=g<=2?g:g-10;
    const ans=(a,b)=>`${pl(a,"valence electron")} and ${pl(b,"energy level")}`;
    const wrongs=[[v,p-1],[p,v],[v+1,p],[v,p+1]].filter(([a,b])=>a>=1&&a<=8&&b>=1&&!(a===v&&b===p));
    return {focus:inGroup(g),
      prompt:`${cap(name)} is not on this grid. It sits in group ${g}, period ${p}${p===5?`, just below ${NAMES[above[0]]}`:""}. Using the patterns you found, predict how many valence electrons and energy levels it has.`,
      correct:ans(v,p),
      wrong:[...new Set(wrongs.map(([a,b])=>ans(a,b)))].slice(0,3),
      hint:"The group tells you the valence electrons. The period tells you the number of energy levels.",
      explain:`Being in group ${g} gives ${name} the same ${pl(v,"valence electron")} as the highlighted elements above it, and being in period ${p} means its electrons fill ${p} energy levels.`};
  }
};

let quiz=null;
function buildQuiz(){
  const used=new Set();
  const plan=["groupValence","groupValence","periodValence","groupLevels","groupLevels","periodLevels","whichGroup","predict"];
  return shuffle(plan).map(t=>QUESTION_TYPES[t](used));
}
function setFocus(zs){
  stage.classList.toggle("focusing",zs.length>0);
  zonesEl.querySelectorAll(".zone").forEach(z=>z.classList.toggle("focus",zs.includes(+z.dataset.z)));
}
function startQuiz(){
  if(placed.size!==20||quiz) return;
  quiz={qs:buildQuiz(),i:0};
  document.body.classList.add("quizzing");
  $("playStatus").hidden=true; $("quizStatus").hidden=false;
  showQuestion();
}
function endQuiz(){
  quiz=null; document.body.classList.remove("quizzing"); setFocus([]);
  $("quiz").innerHTML=""; $("playStatus").hidden=false; $("quizStatus").hidden=true;
}
function showQuestion(){
  const box=$("quiz"), total=quiz.qs.length;
  box.innerHTML="";
  const prog=document.createElement("div"); prog.className="q-progress";
  for(let k=0;k<total;k++){ const s=document.createElement("span"); if(k<quiz.i)s.className="done"; else if(k===quiz.i)s.className="now"; prog.appendChild(s); }
  box.appendChild(prog);
  if(quiz.i>=total){
    setFocus([]);
    $("quizStatus").textContent="Pattern questions complete";
    box.insertAdjacentHTML("beforeend",`<p class="q-prompt">You’ve answered all 8 pattern questions.</p>
      <p class="q-feedback right">Elements in the same group share the same number of valence electrons. Moving across a period adds one valence electron at a time, and moving down a group adds one energy level at a time.</p>`);
    const again=document.createElement("button"); again.className="q-next"; again.textContent="Play again"; again.onclick=newRound;
    box.appendChild(again); return;
  }
  const q=quiz.qs[quiz.i];
  $("quizStatus").textContent=`Pattern question ${quiz.i+1} of ${total}`;
  setFocus(q.focus);
  const count=document.createElement("p"); count.className="q-count"; count.textContent=`Question ${quiz.i+1} of ${total}`;
  const prompt=document.createElement("p"); prompt.className="q-prompt"; prompt.textContent=q.prompt;
  const opts=document.createElement("div"); opts.className="q-opts";
  const fb=document.createElement("p"); fb.className="q-feedback";
  box.append(count,prompt,opts,fb);
  shuffle([q.correct,...q.wrong]).forEach(text=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=text;
    b.onclick=()=>{
      if(text===q.correct){
        b.classList.add("correct"); opts.querySelectorAll(".opt").forEach(o=>o.disabled=true);
        fb.className="q-feedback right"; fb.textContent=q.explain;
        const next=document.createElement("button"); next.className="q-next";
        next.textContent=quiz.i===total-1?"Finish":"Next question";
        next.onclick=()=>{ quiz.i++; showQuestion(); };
        box.appendChild(next); next.focus({preventScroll:true}); next.scrollIntoView({block:"nearest",behavior:"smooth"});
      } else {
        b.classList.add("wrong"); b.disabled=true;
        fb.className="q-feedback hint"; fb.textContent="Not quite. "+q.hint;
      }
    };
    opts.appendChild(b);
  });
}
function zoneAt(x,y){
  for(const z of zonesEl.children){ const r=z.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return z; }
  return null;
}
function onDown(e){
  const t=e.currentTarget;
  if(drag||t.parentElement!==tray) return;
  e.preventDefault();
  const zr=zonesEl.firstElementChild.getBoundingClientRect();
  const w=Math.max(zr.width,60), h=Math.max(zr.height,60);
  const slot=document.createElement("div"); slot.className="slot";
  tray.replaceChild(slot,t); document.body.appendChild(t);
  t.classList.add("dragging"); t.style.width=w+"px"; t.style.height=h+"px";
  drag={t,slot,id:e.pointerId,w,h,hover:null};
  moveTo(e.clientX,e.clientY);
  window.addEventListener("pointermove",onMove); window.addEventListener("pointerup",onUp); window.addEventListener("pointercancel",onUp);
}
function moveTo(x,y){
  drag.t.style.left=(x-drag.w/2)+"px"; drag.t.style.top=(y-drag.h/2)+"px";
  const z=zoneAt(x,y);
  if(z!==drag.hover){ drag.hover&&drag.hover.classList.remove("hover"); drag.hover=z; z&&!z.querySelector(".tile")&&z.classList.add("hover"); }
}
function onMove(e){ if(drag&&e.pointerId===drag.id){ e.preventDefault(); moveTo(e.clientX,e.clientY); } }
function onUp(e){
  if(!drag||e.pointerId!==drag.id) return;
  window.removeEventListener("pointermove",onMove); window.removeEventListener("pointerup",onUp); window.removeEventListener("pointercancel",onUp);
  const {t,slot}=drag; drag.hover&&drag.hover.classList.remove("hover");
  const z=e.type==="pointerup"?zoneAt(e.clientX,e.clientY):null;
  if(z&&z.dataset.z===t.dataset.z){
    t.classList.remove("dragging"); t.removeAttribute("style");
    z.appendChild(t); z.classList.add("pop"); slot.remove();
    placed.add(+t.dataset.z); drag=null; updateStatus(); return;
  }
  if(z&&!z.querySelector(".tile")){
    mistakes++; updateStatus(); z.classList.remove("wrong"); void z.offsetWidth; z.classList.add("wrong");
  }
  const r=slot.getBoundingClientRect();
  t.classList.add("returning");
  requestAnimationFrame(()=>{ t.style.left=r.left+"px"; t.style.top=r.top+"px"; t.style.width=r.width+"px"; t.style.height=r.height+"px"; });
  const finish=()=>{ t.classList.remove("returning","dragging"); t.removeAttribute("style"); tray.replaceChild(t,slot); drag=null; };
  matchMedia("(prefers-reduced-motion: reduce)").matches ? finish() : setTimeout(finish,240);
}
$("newBtn").onclick=newRound;
window.addEventListener("resize",fitAll);
document.addEventListener("gesturestart",e=>e.preventDefault());
fitAll(); newRound();
</script>
</body>
</html>
